# shopping_cart_deployment.yaml
#
# NOTE: the exercise sets "namespace: devops-exercise" here. That breaks in
# three ways:
#   1. the devops-exercise namespace is never created, so apply fails with
#      "namespaces \"devops-exercise\" not found"
#   2. shopping_cart_service.yaml puts the Service in "default", and a
#      Service only selects pods in its OWN namespace -> no endpoints
#   3. the exercise's own Step 8 output lists the shopping-cart pods from a
#      plain "kubectl get pods -o wide", i.e. in the default namespace
# Using "default" so the deployment, the service and Step 8 agree.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopping-cart
  template:
    metadata:
      labels:
        app: shopping-cart
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: shopping-cart
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: shopping-cart-container
        image: shopping-cart:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
